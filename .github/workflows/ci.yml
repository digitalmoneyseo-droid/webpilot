name: CI

on:
  push:
    branches: [main, chore/audit-fixes]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - run: bunx playwright install --with-deps chromium
      - run: bun run lint
      - run: bun run validate:content
      - run: bun run build
      - run: bun run test:e2e
